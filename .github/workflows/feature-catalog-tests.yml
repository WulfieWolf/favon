name: feature-catalog-tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: imagick
          tools: composer:v2
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --force
      - name: Check changed PHP file formatting
        run: |
          vendor/bin/pint --test \
            app/Http/Controllers/Admin/FeatureCatalogController.php \
            app/Http/Controllers/Admin/AdminController.php \
            app/Http/Controllers/PlaceProfileController.php \
            app/Http/Controllers/PlaceSuggestionController.php \
            app/Services/FeatureWorkflowService.php \
            app/Services/PlaceTypeFeatureService.php \
            database/migrations/2026_09_21_180000_finalize_v1_feature_catalog.php \
            database/seeders/DatabaseSeeder.php \
            database/seeders/RolePermissionSeeder.php \
            database/seeders/V1FeatureCatalogSeeder.php \
            routes/web.php \
            tests/Feature/FeatureCatalogAdminTest.php
      - name: Run catalog and affected feature tests
        run: php artisan test --filter='(FeatureCatalogAdminTest|PlaceTypeCatalogTest|PlaceTypeFeatureServiceTest|PlaceInfoSuggestionTest)'
