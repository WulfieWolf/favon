name: locale-tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: imagick
          tools: composer:v2
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --force
      - name: Check affected PHP formatting
        run: |
          vendor/bin/pint --test \
            app/Http/Controllers/LocaleController.php \
            app/Http/Middleware/SetLocale.php \
            lang/de/global.php \
            lang/en/global.php \
            tests/Feature/LocalePreferenceTest.php
      - name: Run locale preference tests
        run: php artisan test --filter=LocalePreferenceTest
