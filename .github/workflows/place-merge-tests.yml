name: place-merge-tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --force
      - name: Check current merge PHP formatting
        run: |
          vendor/bin/pint --test             app/Http/Controllers/Admin/PlaceMergeController.php             app/Services/PlaceMergeService.php             database/migrations/2026_09_21_120000_create_place_merge_tables.php             tests/Feature/PlaceMergeServiceTest.php
      - name: Run current merge tests
        run: php artisan test tests/Feature/PlaceMergeServiceTest.php tests/Feature/PlaceMergeAdminLocaleTest.php
